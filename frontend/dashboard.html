<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
</head>

<body>
    <h1>Dashboard</h1>
    <form id="expenseForm">
        <label for="amount">Amount:</label>
        <input type="number" id="amount" name="amount" required>
        <label for="category">Category:</label>
        <input type="text" id="category" name="category" required>
        <label for="description">Description:</label>
        <input type="text" id="description" name="description" required>
        <button type="submit">Add Expense</button>
    </form>
    <h2>Your Expenses</h2>
    <ul id="expenseList"></ul>

</body>
<script>
    function renderOne(expense, token) {

        const expenseList = document.getElementById('expenseList');
        const li = document.createElement('li');

        li.textContent = `${expense.description}: $${expense.amount}`;
        expenseList.appendChild(li);
        // 3. Create the <button> element
        const myButton = document.createElement('button');
        myButton.textContent = 'Delete'; // Add text to button
        myButton.addEventListener('click', async () => {
            try {
                const response = await fetch(`http://localhost:3000/api/expenses/${expense._id}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    alert(`Failed to delete expense: ${errorData.message}`);
                    return;
                }
                li.remove(); // Remove the <li> element from the DOM
            } catch (error) {
                alert(`An error occurred: ${error.message}`);
            }
        });
        li.appendChild(myButton);

    }
    function renderExpense(expense, token) {
        // the row-building code goes here


        expense.forEach(expense => renderOne(expense, token))

    }


    document.addEventListener('DOMContentLoaded', async () => {
        const token = localStorage.getItem('auth_token');
        if (!token) {
            alert('No token found. Please log in.');
            return;
        }

        try {
            const response = await fetch('http://localhost:3000/api/expenses', {
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            });

            if (!response.ok) {
                const errorData = await response.json();
                alert(`Failed to fetch expenses: ${errorData.message}`);
                return;
            }

            const expenses = await response.json();
            renderExpense(expenses.expenses, token);

        } catch (error) {
            alert(`An error occurred: ${error.message}`);
        }
    });

    document.getElementById('expenseForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const token = localStorage.getItem('auth_token');
        if (!token) {
            alert('No token found. Please log in.');
            return;
        }

        const amount = document.getElementById('amount').value;
        const category = document.getElementById('category').value;
        const description = document.getElementById('description').value;

        try {
            const response = await fetch('http://localhost:3000/api/expenses', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({ amount, category, description })
            });

            if (!response.ok) {
                const errorData = await response.json();
                alert(`Failed to add expense: ${errorData.message}`);
                return;
            }
            const newExpense = await response.json();
            alert('Expense added successfully!');
            renderOne(newExpense.expense, token); // Render the newly added expense
            e.target.reset();
        } catch (error) {
            alert(`An error occurred: ${error.message}`);
        }
    });

</script>

</html>
